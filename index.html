<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ひびカレンダー</title>
<meta name="description" content="予定・バイトのシフトと給料・日付の写真をまとめて残せるカレンダー（α版）">
<meta name="theme-color" content="#527D55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F4EFE4;--card:#FBF8F1;--ink:#2F3A2C;--muted:#646D5C;--line:#E2DACB;--accent:#527D55;--accent-soft:#E3ECDD;--on:#fff;--sun:#C0504D;--sat:#3F7CAC;--shadow:0 8px 28px rgba(60,50,30,.14);--r:14px;--fs:15px;--spring:cubic-bezier(.2,1.2,.4,1);color-scheme:light}
[data-theme=sakura]{--bg:#F8EEEE;--card:#FFF8F7;--ink:#3B2A2E;--muted:#7A6066;--line:#EBD7D9;--accent:#B5566F;--accent-soft:#F6DDE3}
[data-theme=sora]{--bg:#EDF2F7;--card:#F8FBFD;--ink:#25313C;--muted:#5D6B78;--line:#D6E0EA;--accent:#3A73A0;--accent-soft:#DCE8F3}
[data-theme=fuji]{--bg:#F1EEF6;--card:#FAF8FD;--ink:#2F2A3B;--muted:#6A6378;--line:#E0DAEA;--accent:#7559A6;--accent-soft:#E7E0F3}
[data-theme=mikan]{--bg:#F8F0E4;--card:#FFFAF2;--ink:#3A2F22;--muted:#75644F;--line:#EBDCC6;--accent:#B5651D;--accent-soft:#F6E3CD}
[data-theme=yoru]{--bg:#1B1F1A;--card:#252A24;--ink:#E7E9E2;--muted:#A6AD9F;--line:#3A4137;--accent:#8DB88F;--accent-soft:#2F3B2F;--on:#14200F;--sun:#E58A86;--sat:#86B6DE;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark}
html[data-fs=s]{--fs:14px}html[data-fs=l]{--fs:17px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:var(--fs);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto auto 1fr auto;padding-top:env(safe-area-inset-top)}
#top{grid-row:1;display:flex;align-items:center;gap:4px;padding:6px 8px 4px;min-height:52px}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--accent);margin-right:2px}
.brand svg{width:26px;height:26px}
#title{flex:1;font-size:1.15em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;text-align:left;min-width:0}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.ib:active{transform:scale(.92)}
.ib:hover{background:var(--accent-soft)}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.9em}
#views{grid-row:2;display:flex;gap:4px;padding:0 10px 6px}
#views button{flex:1;height:36px;border-radius:10px;font-weight:600;color:var(--muted);background:transparent;font-size:.92em}
#views button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
main{grid-row:3;position:relative;overflow:hidden;min-height:0}
.page{position:absolute;inset:0;overflow:auto}
.page[hidden],#pgCal[hidden]{display:none}
#pgCal{display:flex;flex-direction:column;overflow:hidden}
#calView{flex:none;position:relative;touch-action:pan-y}
#calView.tgrid{flex:1;min-height:0;display:flex;flex-direction:column}
#dayPane{flex:1;min-height:0;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.05);padding:12px 14px 96px}
#calView.tgrid+#dayPane{display:none}
#bottom{grid-row:4;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:.72em;color:var(--muted);font-weight:600;min-height:56px}
#bottom button[aria-current=page]{color:var(--accent)}
#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on);display:grid;place-items:center;box-shadow:var(--shadow);z-index:5;transition:transform .2s var(--spring)}
#fab svg{width:28px;height:28px}
#fab:active{transform:scale(.9)}
#fab[hidden]{display:none}
/* month */
.mhead{display:grid;grid-template-columns:repeat(7,1fr);padding:0 4px;font-size:.75em;color:var(--muted);text-align:center;font-weight:600}
.mhead div{padding:2px 0 4px}
.c-sun{color:var(--sun)!important}.c-sat{color:var(--sat)!important}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:var(--rowh,62px);gap:2px;padding:0 4px 6px}
.mc{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;border-radius:9px;background:var(--card);overflow:hidden;padding:2px 2px 0;min-width:0}
.mc.out{opacity:.45}
.mc.img{background:var(--card) var(--img) center/cover}
.mc.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.35) 45%,rgba(255,255,255,.15));pointer-events:none}
[data-theme=yoru] .mc.img::before{background:linear-gradient(180deg,rgba(20,24,20,.85),rgba(20,24,20,.4) 45%,rgba(20,24,20,.2))}
.mc>*{position:relative}
.mc .dn{font-size:.8em;font-weight:700;line-height:1;padding:3px 3px 1px;display:flex;align-items:center;gap:2px}
.mc .dn b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px}
.mc.today .dn b{background:var(--accent);color:var(--on)}
.mc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.mc .hn{font-size:.55em;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;padding:0 2px}
.mc .bar{display:block;font-size:.62em;line-height:1.35;border-radius:4px;padding:0 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:clip;background:color-mix(in srgb,var(--c) 22%,var(--card));color:var(--ink);border-left:3px solid var(--c)}
.mc .bar.all{background:var(--c);color:#fff;border-left:0}
.mc .more{font-size:.58em;color:var(--muted);padding:0 3px}
.mc .dot{width:6px;height:6px;border-radius:3px;background:var(--accent)}
/* day pane / list */
.dph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dph h2{font-size:1.05em;margin:0;flex:1}
.dph .hol{color:var(--sun);font-size:.8em;font-weight:600;margin-left:6px}
.evl{list-style:none;margin:0;padding:0}
.evi{display:flex;align-items:stretch;gap:10px;width:100%;text-align:left;padding:9px 6px;border-radius:12px;min-height:48px}
.evi:hover{background:var(--accent-soft)}
.evi .cb{width:4px;border-radius:2px;background:var(--c);flex:none}
.evi .tm{width:62px;flex:none;font-size:.78em;color:var(--muted);line-height:1.35;font-variant-numeric:tabular-nums}
.evi .tt{flex:1;min-width:0}
.evi .tt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evi .tt small{display:block;color:var(--muted);font-size:.78em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evi .ic{color:var(--muted);display:flex;gap:2px;align-items:center}
.evi .ic svg{width:16px;height:16px}
.empty{color:var(--muted);font-size:.9em;padding:14px 4px;text-align:center}
.lgh{font-size:.82em;font-weight:700;color:var(--muted);margin:14px 4px 4px;display:flex;gap:6px}
.lgh .hol{color:var(--sun)}
.photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.ph{position:relative;flex:none;width:84px;height:84px;border-radius:12px;background:var(--line) center/cover;overflow:hidden}
.ph .x{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.ph .x svg{width:16px;height:16px}
.addph{flex:none;width:84px;height:84px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72em}
.memo-banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:var(--accent-soft);margin-bottom:10px;font-size:.88em}
.memo-banner b{color:var(--accent)}
/* time grid */
.tgh{display:grid;grid-template-columns:44px repeat(var(--n),1fr);border-bottom:1px solid var(--line);flex:none}
.tgh .dl{text-align:center;padding:2px 0 4px;font-size:.75em;color:var(--muted);font-weight:600;min-width:0}
.tgh .dl b{display:block;font-size:1.35em;color:var(--ink);line-height:1.2}
.tgh .dl.today b{color:var(--accent)}
.tgh .dl small{display:block;font-size:.8em;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tga{display:grid;grid-template-columns:44px repeat(var(--n),1fr);border-bottom:1px solid var(--line);flex:none;max-height:96px;overflow:auto}
.tga .lab{font-size:.62em;color:var(--muted);padding:4px 2px;text-align:right}
.tga .col{padding:2px 1px;min-height:24px;border-left:1px solid var(--line);min-width:0}
.tga .bar{display:block;width:100%;text-align:left;font-size:.7em;background:var(--c);color:#fff;border-radius:5px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgb{flex:1;overflow:auto;position:relative}
.tgh,.tga,.tgb{scrollbar-gutter:stable}.tgh{overflow:hidden}
.tgin{display:grid;grid-template-columns:44px repeat(var(--n),1fr);position:relative;height:calc(var(--hh) * 24)}
.hrs{position:relative}
.hrs span{position:absolute;right:4px;font-size:.62em;color:var(--muted);transform:translateY(-50%)}
.tcol{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hh));min-width:0}
.tb{position:absolute;text-align:left;border-radius:7px;padding:2px 4px;font-size:.7em;line-height:1.3;overflow:hidden;background:color-mix(in srgb,var(--c) 25%,var(--card));border-left:3px solid var(--c);color:var(--ink)}
.tb b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now{position:absolute;left:0;right:0;height:2px;background:var(--sun);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:4px;background:var(--sun)}
/* generic sections */
.wrap{max-width:720px;margin:0 auto;padding:8px 14px 110px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:1em;display:flex;align-items:center;gap:8px}
.card h3 svg{color:var(--accent)}
.note{color:var(--muted);font-size:.8em;line-height:1.6;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;font-size:.88em;font-weight:600}
.chip .sw{width:12px;height:12px;border-radius:6px;background:var(--c)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.chip[aria-pressed=true] .sw{box-shadow:0 0 0 2px #fff}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:34px;height:34px;border-radius:17px;background:var(--c);border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.swb[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.swb.none{background:conic-gradient(var(--line) 0 25%,var(--card) 0 50%,var(--line) 0 75%,var(--card) 0)}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.danger{color:var(--sun)}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88em;border-radius:12px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns .pri{flex:1}
.setrow{display:flex;align-items:center;gap:10px;min-height:48px;border-top:1px solid var(--line);padding:6px 0}
.setrow:first-of-type{border-top:0}
.setrow>span{flex:1}
.setrow small{display:block;color:var(--muted);font-size:.78em}
.tg{appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s;margin:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .2s var(--spring);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg:checked{background:var(--accent)}
.tg:checked::after{transform:translateX(20px)}
.row{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.row>.lab{width:72px;flex:none;font-size:.85em;color:var(--muted);font-weight:600}
.row>.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.tin{width:100%;font-size:1.15em;font-weight:600}
.joblist,.tpllist{list-style:none;margin:0;padding:0}
.jrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-top:1px solid var(--line);min-height:52px}
.jrow:first-child{border-top:0}
.jrow .sw{width:14px;height:14px;border-radius:7px;background:var(--c);flex:none}
.jrow span{flex:1;min-width:0}
.jrow small{display:block;color:var(--muted);font-size:.78em}
.pay{display:flex;align-items:baseline;gap:6px;margin:4px 0 10px}
.pay b{font-size:1.9em;color:var(--accent);font-variant-numeric:tabular-nums}
.paytbl{width:100%;border-collapse:collapse;font-size:.85em;font-variant-numeric:tabular-nums}
.paytbl td,.paytbl th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
.paytbl th{color:var(--muted);font-weight:600;font-size:.9em}
.paytbl td:first-child,.paytbl th:first-child{text-align:left}
.sgrid .mc{min-height:0;background:var(--bg)}
.sgrid .bar{font-size:.6em}
.srch{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.srch input{flex:1;font-size:1.05em}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(30,30,20,.35);z-index:20;opacity:0;transition:opacity .2s}
#scrim.on{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;z-index:21;padding:14px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s var(--spring);box-shadow:var(--shadow)}
#sheet.on{transform:none}
#sheet h2{margin:2px 48px 10px 0;font-size:1.1em}
.xbtn{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:22px;background:var(--bg);display:grid;place-items:center;margin:-4px -6px 0 0;z-index:2}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:.9em;opacity:0;pointer-events:none;transition:.25s var(--spring);z-index:40;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent-soft);font-weight:700;padding:6px 4px;text-decoration:underline}
/* memories */
#mem{position:fixed;inset:0;background:#111;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#mem[hidden]{display:none}
#mem canvas{max-width:100%;max-height:calc(100vh - 120px);border-radius:12px;background:#000}
#mem .bar{display:flex;gap:10px}
#mem .btn{background:#2a2a2a;color:#fff;border-color:#444}
#mem .xbtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:#333;color:#fff;margin:0}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:31;display:grid;place-items:center}
#viewer[hidden]{display:none}
#viewer img{max-width:96vw;max-height:90vh;border-radius:8px}
#viewer .xbtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:#333;color:#fff;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* PC */
@media (min-width:900px){
 #app{grid-template-columns:220px 1fr;grid-template-rows:auto auto 1fr}
 #top{grid-column:1/3}
 #views{grid-column:2;max-width:420px}
 #bottom{grid-row:2/4;grid-column:1;flex-direction:column;border-top:0;background:transparent;padding:4px 10px;gap:2px}
 #bottom button{flex:none;flex-direction:row;gap:10px;font-size:.92em;min-height:44px;padding:0 12px;border-radius:12px;justify-content:flex-start}
 #bottom button[aria-current=page]{background:var(--card)}
 main{grid-column:2;grid-row:3}
 #pgCal{flex-direction:row;gap:12px;padding:0 12px 12px 0}
 #calView{flex:1;min-width:0;display:flex;flex-direction:column}
 #calView .mgrid{flex:1;grid-auto-rows:1fr}
 #dayPane{flex:0 0 340px;border-radius:18px;padding-bottom:20px}
 #calView.tgrid{background:var(--card);border-radius:18px;overflow:hidden}
 #sheet{left:50%;right:auto;top:8vh;bottom:auto;width:min(560px,92vw);max-height:84vh;border-radius:22px;transform:translate(-50%,24px);opacity:0;transition:transform .3s var(--spring),opacity .2s}
 #sheet.on{transform:translate(-50%,0);opacity:1}
 #fab{bottom:28px;right:28px}
 #toast{bottom:40px}
 .mc .bar{font-size:.72em}
 .mc .hn{font-size:.66em}
}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <span class="brand" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="22" rx="6" fill="currentColor" opacity=".15"/><rect x="4" y="6" width="24" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 3v6M22 3v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M11 21c3-6 7-7 10-7-1 5-4 8-10 7z" fill="currentColor"/></svg></span>
  <button class="ib" data-a="prev" aria-label="前へ"><span data-ic="chevL"></span></button>
  <h1 id="title" aria-live="polite"></h1>
  <button class="ib" data-a="next" aria-label="次へ"><span data-ic="chevR"></span></button>
  <button class="pill" data-a="today">今日</button>
  <button class="ib" data-a="page" data-v="search" aria-label="検索"><span data-ic="search"></span></button>
 </header>
 <nav id="views" aria-label="表示の切り替え">
  <button data-a="view" data-v="month" aria-pressed="true">月</button>
  <button data-a="view" data-v="week" aria-pressed="false">週</button>
  <button data-a="view" data-v="day" aria-pressed="false">日</button>
  <button data-a="view" data-v="list" aria-pressed="false">予定</button>
 </nav>
 <main>
  <section id="pgCal" class="page"><div id="calView"></div><div id="dayPane"></div></section>
  <section id="pgShift" class="page" hidden></section>
  <section id="pgSearch" class="page" hidden></section>
  <section id="pgSet" class="page" hidden></section>
 </main>
 <nav id="bottom" aria-label="メニュー">
  <button data-a="page" data-v="cal" aria-current="page"><span data-ic="cal"></span>カレンダー</button>
  <button data-a="page" data-v="shift"><span data-ic="work"></span>シフト</button>
  <button data-a="page" data-v="search"><span data-ic="search"></span>検索</button>
  <button data-a="page" data-v="set"><span data-ic="gear"></span>設定</button>
 </nav>

<script>

const PALETTE = ['#527D55', '#3A73A0', '#C0504D', '#D9822B', '#7559A6', '#B8962E', '#3E8E8E', '#B5566F', '#6B7280'];

$$('[data-ic]').forEach(e => e.outerHTML = ICON[e.dataset.ic] || '');

/* ==== storage ==== */
let _idb;
function idb() {
  if (_idb) return _idb;
  return _idb = new Promise((res, rej) => {
    const r = indexedDB.open('ryvona-calendar', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) { const d = await idb(); return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

const DEF_DB = () => ({ v: 1, cals: [{ id: 'main', name: 'マイカレンダー', color: '#527D55', on: true }], events: [], jobs: [], tpls: [], imgs: {} });
let DB = DEF_DB();
const SET_KEY = 'cal.settings';

try { const s = JSON.parse(localStorage.getItem(SET_KEY) || '{}'); for (const k in DEF_SET) if (typeof s[k] === typeof DEF_SET[k]) SET[k] = s[k]; } catch (e) { }
const saveSet = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch (e) { } syDiffSoon(); };
let saveT = 0;

function normDB(d) {

/* ==== Japanese holidays (computed, 2000-2099) ==== */
const HC = {};
const nthMon = (y, m, n) => { const f = dnYMD(y, m, 1); return f + ((1 - wd(f) + 7) % 7) + (n - 1) * 7; };
const equinox = (y, base) => Math.floor(base + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
function holidays(y) {
  if (HC[y]) return HC[y];
  const H = new Map(), add = (m, d, n) => H.set(dnYMD(y, m, d), n);
  add(1, 1, '元日');
  H.set(y >= 2000 ? nthMon(y, 1, 2) : dnYMD(y, 1, 15), '成人の日');
  add(2, 11, '建国記念の日');
  if (y >= 2020) add(2, 23, '天皇誕生日');
  add(3, equinox(y, 20.8431), '春分の日');
  add(4, 29, y >= 2007 ? '昭和の日' : 'みどりの日');
  add(5, 3, '憲法記念日'); if (y >= 2007) add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  if (y === 2020) add(7, 23, '海の日'); else if (y === 2021) add(7, 22, '海の日'); else if (y >= 2003) H.set(nthMon(y, 7, 3), '海の日'); else if (y >= 1996) add(7, 20, '海の日');
  if (y === 2020) add(8, 10, '山の日'); else if (y === 2021) add(8, 8, '山の日'); else if (y >= 2016) add(8, 11, '山の日');
  H.set(y >= 2003 ? nthMon(y, 9, 3) : dnYMD(y, 9, 15), '敬老の日');
  add(9, equinox(y, 23.2488), '秋分の日');
  const sp = y >= 2020 ? 'スポーツの日' : '体育の日';
  if (y === 2020) add(7, 24, sp); else if (y === 2021) add(7, 23, sp); else H.set(y >= 2000 ? nthMon(y, 10, 2) : dnYMD(y, 10, 10), sp);
  add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  if (y >= 1989 && y <= 2018) add(12, 23, '天皇誕生日');
  if (y === 2019) { add(5, 1, '天皇の即位の日'); add(10, 22, '即位礼正殿の儀の行われる日'); }
  const base = [...H.keys()].sort((a, b) => a - b);
  for (const k of base) if (H.has(k + 2) && !H.has(k + 1) && wd(k + 1) !== 0) H.set(k + 1, '国民の休日');
  for (const k of [...H.keys()].sort((a, b) => a - b)) if (wd(k) === 0 && H.get(k) !== '振替休日') { let d = k + 1; while (H.has(d)) d++; H.set(d, '振替休日'); }
  return HC[y] = H;
}
const holName = n => SET.hol ? holidays(ymd(n).y).get(n) || '' : '';
const dayCls = n => holName(n) || wd(n) === 0 ? 'c-sun' : wd(n) === 6 ? 'c-sat' : '';

/* ==== events & repeats ==== */
const calOf = id => DB.cals.find(c => c.id === id);
const jobOf = id => DB.jobs.find(j => j.id === id);
const evColor = e => e.col || (e.kind === 'shift' && jobOf(e.job) && jobOf(e.job).color) || (calOf(e.cal) || {}).color || PALETTE[0];
const durDays = e => dn(e.ed) - dn(e.sd);
// start days of the occurrences of e whose span touches [a, b]
function occs(e, a, b) {
  const s = dn(e.sd), dur = durDays(e), r = e.rep, out = [];
  const lo = a - dur, hi = b, until = r && r.until ? dn(r.until) : Infinity, ex = e.ex || [];
  const top = Math.min(hi, until);
  const push = d => { if (d >= lo && d <= top && d >= s && !ex.includes(ds(d))) out.push(d); };
  if (!r || !r.f) { push(s); return out; }
  const iv = Math.max(1, +r.i || 1);
  if (r.f === 'd') { const k = Math.max(0, Math.ceil((lo - s) / iv)); for (let d = s + k * iv; d <= top; d += iv) push(d); }
  else if (r.f === 'w' || r.f === 'wd') {
    const days = r.f === 'wd' ? [1, 2, 3, 4, 5] : (r.wd && r.wd.length ? r.wd : [wd(s)]), w0 = s - wd(s);
    for (let d = Math.max(lo, s); d <= top; d++) { if (!days.includes(wd(d))) continue; if (r.f === 'w' && Math.floor((d - wd(d) - w0) / 7) % iv) continue; push(d); }
  } else if (r.f === 'm' || r.f === 'y') {
    const o = ymd(s), L = ymd(Math.max(lo, s)), step = r.f === 'm' ? iv : iv * 12, m0 = o.y * 12 + o.m - 1;
    let k = Math.max(0, Math.floor((L.y * 12 + L.m - 1 - m0) / step) - 1);
    for (; ; k++) {
      const mi = m0 + k * step, y = Math.floor(mi / 12), m = mi % 12 + 1;
      if (dnYMD(y, m, 1) > top) break;
      if (o.d <= dim(y, m)) push(dnYMD(y, m, o.d));
    }
  }
  return out;
}
// timed events that end at 0:00 do not show on that last day
const endShow = (e, s) => s + durDays(e) - (!e.all && durDays(e) > 0 && tmin(e.et) === 0 ? 1 : 0);
function occRange(a, b, all) {
  const on = new Set(DB.cals.filter(c => c.on).map(c => c.id)), out = [];
  for (const e of DB.events) { if (!all && !on.has(e.cal)) continue; for (const s of occs(e, a, b)) out.push({ e, s, en: endShow(e, s) }); }
  return out;
}
const occCmp = (x, y) => (y.e.all - x.e.all) || (x.e.all ? (y.en - y.s) - (x.en - x.s) : 0) || (x.s - y.s) || (tmin(x.e.st) - tmin(y.e.st)) || String(x.e.t).localeCompare(y.e.t);
function byDay(a, b) {
  const m = new Map();
  for (const o of occRange(a, b)) for (let d = Math.max(a, o.s); d <= Math.min(b, o.en); d++) { if (!m.has(d)) m.set(d, []); m.get(d).push(o); }
  for (const l of m.values()) l.sort(occCmp);
  return m;
}
function timeLabel(o, d) {
  const e = o.e;
  if (e.all) return o.s === o.en ? '終日' : '終日<br>' + (d - o.s + 1) + '/' + (o.en - o.s + 1) + '日目';
  const a = d === o.s ? e.st : '0:00', b = d === o.s + durDays(e) ? e.et : '24:00';
  return esc(a) + '<br>' + esc(b);
}
const repLabel = r => !r || !r.f ? '' : ({ d: '毎日', w: '毎週', wd: '平日', m: '毎月', y: '毎年' })[r.f] + (r.i > 1 ? '（' + r.i + (r.f === 'd' ? '日' : r.f === 'w' ? '週' : r.f === 'm' ? 'か月' : '年') + 'ごと）' : '');

/* ==== state ==== */
const S = { page: 'cal', view: SET.view, cur: todayDn(), sel: todayDn(), shiftTpl: null, q: '' };
const deskMQ = matchMedia('(min-width:900px)');
let deskOn = deskMQ.matches;

/* ==== images (per day) ==== */
const thumbs = new Map(); // id -> objectURL
const thumbP = new Map(); // id -> in-flight load
async function loadThumbs(ids) {
  const need = ids.filter(id => !thumbs.has(id));
  if (!need.length) return false;
  await Promise.all(need.map(id => {
    if (!thumbP.has(id)) thumbP.set(id, (async () => { try { const b = await getImg(id, true); thumbs.set(id, b ? URL.createObjectURL(b) : ''); } catch (e) { thumbs.set(id, ''); } thumbP.delete(id); })());
    return thumbP.get(id);
  }));
  return true;
}
async function fitBlob(src, max, q) {
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
async function addPhotos(day, files) {
  let n = 0;
  for (const f of files) {
    if (!/^image\//.test(f.type)) continue;
    try {
      const bm = await createImageBitmap(f);
      const full = await fitBlob(bm, 1600, .86), th = await fitBlob(bm, 360, .8);
      bm.close && bm.close();
      const id = uid();
      await kvSet('img:' + id, full); await kvSet('imgt:' + id, th);
      const k = ds(day); (DB.imgs[k] = DB.imgs[k] || []).push(id); n++;
    } catch (e) { toast('この画像は読み込めませんでした'); }
  }
  if (n) { save(); toast(n + '枚の写真を入れました'); render(); }
}
async function delPhoto(day, id) {
  const k = ds(day), l = DB.imgs[k] || [];
  DB.imgs[k] = l.filter(x => x !== id); if (!DB.imgs[k].length) delete DB.imgs[k];
  save(); render();
  toast('写真を外しました', '元に戻す', () => { (DB.imgs[k] = DB.imgs[k] || []).push(id); save(); render(); });
  setTimeout(() => { if (!Object.values(DB.imgs).some(a => a.includes(id))) { kvDel('img:' + id).catch(() => { }); kvDel('imgt:' + id).catch(() => { }); } }, 9000);
}
const dayImgs = n => DB.imgs[ds(n)] || [];

/* ==== render: shell ==== */
function setTitle() {
  const { y, m } = ymd(S.cur);
  let t = y + '年' + m + '月';
  if (S.page === 'cal' && S.view === 'week') { const a = weekStart(S.cur), b = a + 6; t = md(a) + '〜' + (ymd(a).m === ymd(b).m ? ymd(b).d + '日' : md(b)); }
  else if (S.page === 'cal' && S.view === 'day') t = ymd(S.cur).y + '年' + mdw(S.cur);
  else if (S.page === 'cal' && S.view === 'list') t = md(S.cur) + 'からの予定';
  else if (S.page === 'search') t = '検索'; else if (S.page === 'set') t = '設定';
  else if (S.page === 'shift') t = y + '年' + m + '月のシフト';
  $('#title').textContent = t;
  const nav = S.page === 'cal' || S.page === 'shift';
  $$('[data-a=prev],[data-a=next],[data-a=today]').forEach(b => b.style.visibility = nav ? '' : 'hidden');
}
const weekStart = n => n - ((wd(n) - SET.ws + 7) % 7);
function render() {
  document.documentElement.dataset.theme = SET.theme; document.documentElement.dataset.fs = SET.fs;
  const tc = { wakaba: '#527D55', sakura: '#B5566F', sora: '#3A73A0', fuji: '#7559A6', mikan: '#B5651D', yoru: '#1B1F1A' }[SET.theme];
  $('meta[name=theme-color]').content = tc || '#527D55';
  $$('#bottom button').forEach(b => { if (b.dataset.v === S.page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('#views').style.display = S.page === 'cal' ? '' : 'none';
  $$('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.view));
  for (const [p, id] of [['cal', 'pgCal'], ['shift', 'pgShift'], ['search', 'pgSearch'], ['set', 'pgSet']]) $('#' + id).hidden = S.page !== p;
  $('#fab').hidden = !(S.page === 'cal');
  setTitle();
  if (S.page === 'cal') renderCal(); else if (S.page === 'shift') renderShift(); else if (S.page === 'search') renderSearch(); else renderSettings();
}

/* ==== month view ==== */
function monthCells(y, m, map, opt = {}) {
  const first = dnYMD(y, m, 1), start = weekStart(first), t = todayDn(), lim = opt.lim || (deskOn ? 4 : 3);
  let h = '<div class="mhead">' + [0, 1, 2, 3, 4, 5, 6].map(i => { const w = (i + SET.ws) % 7; return `<div class="${w === 0 ? 'c-sun' : w === 6 ? 'c-sat' : ''}">${WD[w]}</div>`; }).join('') + '</div>';
  h += `<div class="mgrid${opt.cls ? ' ' + opt.cls : ''}" role="grid">`;
  const tids = [];
  for (let i = 0; i < 42; i++) {
    const d = start + i, o = ymd(d), list = (map.get(d) || []).filter(opt.filter || (() => true)), hn = holName(d);

function memoriesFor(d) {
  const o = ymd(d), key = '-' + pad(o.m) + '-' + pad(o.d), ids = [], years = [];
  for (const k in DB.imgs) if (k.endsWith(key) && +k.slice(0, 4) < o.y) { years.push(+k.slice(0, 4)); for (const id of DB.imgs[k]) ids.push({ id, y: +k.slice(0, 4) }); }
  const ann = (byDay(d, d).get(d) || []).find(x => x.e.anniv);
  let title = '';
  if (ann) { const n = o.y - +ann.e.sd.slice(0, 4); title = (ann.e.t || '記念日') + (n > 0 ? ' ' + n + '周年' : ''); }
  else if (years.length) { const n = o.y - Math.min(...years); title = n + '年前の今日'; }
  ids.sort((a, b) => a.y - b.y);
  return { ids, title };
}
const MEM = { run: false, raf: 0, t0: 0, pausedAt: 0, slides: [], title: '', rec: null };
const MEM_IN = 2200, MEM_PER = 3600, MEM_FADE = 900;
async function playMemories(d) {
  const m = memoriesFor(d); if (!m.ids.length) return;
  const slides = [];
  for (const it of m.ids.slice(0, 40)) { try { const b = await getImg(it.id); if (b) slides.push({ bm: await createImageBitmap(b), y: it.y }); } catch (e) { } }
  if (!slides.length) { toast('写真を読み込めませんでした'); return; }
  Object.assign(MEM, { slides, title: m.title, sub: md(d), run: true, t0: performance.now(), pausedAt: 0 });
  $('#mem').hidden = false; $('#memPause').textContent = '一時停止';
  $('#memSave').hidden = !(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream);
  cancelAnimationFrame(MEM.raf); memFrame();
}
function memDraw(t) {
  const cv = $('#memCv'), c = cv.getContext('2d'), W = cv.width, H = cv.height, sl = MEM.slides, total = MEM_IN + sl.length * MEM_PER;
  t = t % (total + 1500);
  c.fillStyle = '#16140f'; c.fillRect(0, 0, W, H);
  const cover = (bm, k, a, drift) => { const s = Math.max(W / bm.width, H / bm.height) * k, w = bm.width * s, h = bm.height * s; c.globalAlpha = a; c.drawImage(bm, (W - w) / 2 + drift * W * .02, (H - h) / 2, w, h); c.globalAlpha = 1; };
  if (t < MEM_IN) { cover(sl[0].bm, 1.12, .35 * Math.min(1, t / 600), 0); }
  else if (t < total) {
    const i = Math.floor((t - MEM_IN) / MEM_PER), lt = (t - MEM_IN) % MEM_PER, p = lt / MEM_PER;
    if (i > 0 && lt < MEM_FADE) cover(sl[i - 1].bm, 1.08, 1, 1);
    cover(sl[i].bm, 1 + .08 * p, i > 0 ? Math.min(1, lt / MEM_FADE) : Math.min(1, lt / 500), (i % 2 ? -1 : 1) * (p - .5));
    const g = c.createLinearGradient(0, H * .7, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); c.fillStyle = g; c.fillRect(0, H * .7, W, H * .3);
    c.fillStyle = '#fff'; c.font = '600 40px system-ui,sans-serif'; c.textAlign = 'left'; c.fillText(sl[i].y + '年', 48, H - 56);
  } else { cover(sl[sl.length - 1].bm, 1.08, Math.max(0, 1 - (t - total) / 1200), 1); }
  if (t < MEM_IN || t >= total) {
    const a = t < MEM_IN ? Math.min(1, t / 500) * Math.min(1, (MEM_IN - t) / 400) : Math.min(1, (t - total) / 500);
    c.globalAlpha = a; c.fillStyle = '#fff'; c.textAlign = 'center';
    c.font = '700 64px system-ui,sans-serif'; c.fillText(MEM.title, W / 2, H / 2, W - 80);
    c.font = '400 34px system-ui,sans-serif'; c.fillText(MEM.sub, W / 2, H / 2 + 64); c.globalAlpha = 1;
  }

}
function memFrame() {
  if (!MEM.run) return;
  const len = memDraw(performance.now() - MEM.t0);

  MEM.raf = requestAnimationFrame(memFrame);
}
function memClose() { MEM.run = false; cancelAnimationFrame(MEM.raf); if (MEM.rec) { MEM.rec.onstop = null; MEM.rec.stop(); MEM.rec = null; } MEM.slides.forEach(s => s.bm.close && s.bm.close()); MEM.slides = []; $('#mem').hidden = true; }

<script>
/* ==== widgets hook (sw-widgets.js / native/android) ==== */
// After each save, ask the service worker to refresh the Windows 11 widgets, and hand the next
// 14 days to the Android app's widget when running inside it (window.HibiAndroid bridge).
(() => {
  'use strict';
  const orig = window.saveNow; if (typeof orig !== 'function') return;
  const ping = () => {
    try { const c = navigator.serviceWorker && navigator.serviceWorker.controller; if (c) c.postMessage({ type: 'widgets-refresh' }); } catch (e) { }
    try {
      if (!(window.HibiAndroid && HibiAndroid.setUpcoming)) return;
      const t = todayDn(), m = byDay(t, t + 13), out = [];
      for (const [d, l] of [...m.entries()].sort((a, b) => a[0] - b[0])) for (const o of l) out.push({ d: ds(d), all: !!o.e.all, st: d === o.s ? o.e.st || '' : '', et: d === o.s + durDays(o.e) ? o.e.et || '' : '', t: o.e.t || '（無題）', c: evColor(o.e), h: holName(d) });
      HibiAndroid.setUpcoming(JSON.stringify({ at: Date.now(), items: out.slice(0, 200) }));
    } catch (e) { }
  };
  window.saveNow = function () { const p = orig.apply(this, arguments); Promise.resolve(p).then(ping, () => { }); return p; };
  setTimeout(ping, 3000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) ping(); });
})();
</script>
